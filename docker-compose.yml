version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Database Connection
      # Use host.docker.internal to connect to host's MySQL on Windows/Mac
      - DB_HOST=host.docker.internal
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-kiranrxsmart}
      
      # Telegram Bot
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      
      # Mail Configuration
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      
      # Timezone
      - TZ=Asia/Kolkata
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount source code for live updates (optional/dev)
      - .:/usr/src/app
      # Mount uploads directory to persist data
      - ./server/uploads:/usr/src/app/server/uploads
      # Anonymous volume for node_modules to use image version instead of host version
      - /usr/src/app/server/node_modules
    restart: always
