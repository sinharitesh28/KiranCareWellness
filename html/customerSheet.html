<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Sheet - KiranCareWellness</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#00712D',
                        'secondary': '#D5ED9F',
                        'tertiary': '#FFFBE6',
                        'quarterly': '#FF9100',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-tertiary font-sans min-h-screen p-4 sm:p-6 lg:p-8">

    <div class="w-full max-w-7xl mx-auto bg-white p-6 rounded-2xl shadow-lg border border-gray-200">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row items-center justify-between mb-6">
            <div class="flex items-center mb-4 sm:mb-0">
                <a href="/index.html" class="mr-4 text-gray-500 hover:text-primary transition">
                    <i class="fas fa-arrow-left text-xl"></i>
                </a>
                <img src="/img/KiranCareWellnessLogo.svg" onerror="this.onerror=null; this.src='https://placehold.co/40x40/00712D/ffffff?text=KR';" alt="Logo" class="h-10 w-auto mr-4">
                <h1 class="text-2xl font-bold text-primary">Customer Sheet</h1>
            </div>
            
            <div class="flex gap-3">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fas fa-search text-gray-400"></i>
                    </span>
                    <input type="text" id="searchInput" class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary text-sm w-64" placeholder="Search customer...">
                </div>
                <button id="downloadCsvBtn" class="bg-primary text-white px-4 py-2 rounded-lg font-semibold hover:bg-green-700 transition text-sm flex items-center">
                    <i class="fas fa-file-csv mr-2"></i> Export CSV
                </button>
            </div>
        </header>

        <!-- Customer Table -->
        <div class="overflow-x-auto rounded-lg border border-gray-200">
            <table class="w-full text-sm text-left text-gray-600" id="customerTable">
                <thead class="bg-gray-50 text-gray-700 uppercase font-semibold">
                    <tr>
                        <th class="px-4 py-3">Customer Name</th>
                        <th class="px-4 py-3">Mobile / Email</th>
                        <th class="px-4 py-3 text-center">Total Orders</th>
                         <th class="px-4 py-3 text-right">Total Spent</th>
                        <th class="px-4 py-3 w-1/3">Last 3 Orders (Bill # - Date - Amount)</th>
                    </tr>
                </thead>
                <tbody id="customerTableBody" class="divide-y divide-gray-200">
                    <!-- Populated by JS -->
                    <tr>
                        <td colspan="5" class="px-4 py-8 text-center text-gray-500">
                            <i class="fas fa-spinner fa-spin mr-2"></i> Loading customers...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>

    <!-- Scripts -->
    <script src="/js/customerSheet.js"></script>
</body>
</html>
