<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiranCareWellness - User Management</title>
    <link rel="icon" type="image/png" href="../img/KiranCareWellnessLogo.png">
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#00712D',
                        'secondary': '#D5ED9F',
                        'tertiary': '#FFFBE6',
                        'quarterly': '#FF9100',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/UserManagement.css">
</head>
<body class="bg-tertiary font-sans min-h-screen p-4 sm:p-8">

    <div class="max-w-6xl mx-auto space-y-8">
        <!-- Header -->
        <header class="flex items-center justify-between bg-white p-6 rounded-2xl shadow-lg border border-primary/10">
            <div class="flex items-center space-x-4">
                <a href="/index.html" class="text-gray-500 hover:text-primary transition">
                    <i class="fas fa-arrow-left text-2xl"></i>
                </a>
                <div class="flex items-center">
                    <img src="/img/KiranCareWellnessLogo.svg" onerror="this.onerror=null; this.src='https://placehold.co/40x40/00712D/ffffff?text=KR';" alt="Logo" class="h-10 w-auto mr-4">
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-primary">User Management</h1>
                </div>
            </div>
            <button id="addUserBtn" class="bg-primary text-white px-6 py-2 rounded-lg font-semibold hover:bg-primary/90 transition shadow-md flex items-center">
                <i class="fas fa-user-plus mr-2"></i> Add New User
            </button>
        </header>

        <!-- Users Table Container -->
        <main class="bg-white rounded-2xl shadow-xl border border-primary/5 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-primary text-white">
                        <tr>
                            <th class="p-4 font-bold uppercase text-xs">Code</th>
                            <th class="p-4 font-bold uppercase text-xs">Name</th>
                            <th class="p-4 font-bold uppercase text-xs">Position</th>
                            <th class="p-4 font-bold uppercase text-xs">Gmail</th>
                            <th class="p-4 font-bold uppercase text-xs">Contact</th>
                            <th class="p-4 font-bold uppercase text-xs">Branch</th>
                            <th class="p-4 font-bold uppercase text-xs">Admin</th>
                            <th class="p-4 font-bold uppercase text-xs text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody" class="divide-y divide-gray-100">
                        <!-- Users will be populated here -->
                        <tr>
                            <td colspan="8" class="p-8 text-center text-gray-500">
                                <div class="flex flex-col items-center">
                                    <i class="fas fa-spinner fa-spin text-3xl mb-2 text-primary"></i>
                                    <p>Loading users...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- User Modal (Add/Edit) -->
    <div id="userModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-slide-up">
            <div class="bg-primary p-4 flex justify-between items-center text-white">
                <h2 id="modalTitle" class="text-xl font-bold">Add New User</h2>
                <button id="closeModal" class="hover:rotate-90 transition-transform">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>
            <form id="userForm" class="p-6 space-y-4">
                <input type="hidden" id="userCode">
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="userName" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-primary/20 outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Position</label>
                    <input type="text" id="userPosition" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-primary/20 outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Gmail Address</label>
                    <input type="email" id="userGmail" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-primary/20 outline-none">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Contact No</label>
                        <input type="number" id="userContact" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-primary/20 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Branch</label>
                        <input type="text" id="userBranch" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-primary/20 outline-none">
                    </div>
                </div>
                
                <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <input type="checkbox" id="userIsAdmin" class="w-5 h-5 text-primary rounded focus:ring-primary">
                    <label for="userIsAdmin" class="text-sm font-bold text-gray-700">Grant Administrative Access</label>
                </div>

                <div class="pt-4 flex space-x-3">
                    <button type="button" id="cancelBtn" class="flex-1 px-4 py-2 border border-gray-300 text-gray-600 rounded-lg font-semibold hover:bg-gray-50 transition">Cancel</button>
                    <button type="submit" class="flex-1 px-4 py-2 bg-primary text-white rounded-lg font-semibold hover:bg-primary/90 transition shadow-md">Save User</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Message Container -->
    <div id="messageContainer" class="fixed top-5 right-5 z-[60] space-y-3"></div>

    <script src="/js/UserManagement.js"></script>
</body>
</html>
